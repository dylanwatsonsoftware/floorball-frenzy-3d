html/head_include="<style>#status{background:radial-gradient(circle at 18% 28%,rgba(45,223,112,.24),transparent 34%),radial-gradient(circle at 82% 72%,rgba(81,184,255,.24),transparent 36%),linear-gradient(145deg,#051328,#071d35 58%,#061426)!important;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}#status:before{content:'FLOORBALL FRENZY';position:absolute;top:9%;font-weight:900;font-size:clamp(22px,5vw,44px);letter-spacing:.11em;color:#fff;text-shadow:0 3px 0 #10233c,0 0 24px rgba(72,227,130,.35)}#status:after{content:'Preparing the rink…';position:absolute;bottom:15%;font-size:clamp(14px,3vw,20px);font-weight:700;letter-spacing:.08em;color:#dff8eb}#status-splash{width:min(72vw,520px)!important;height:auto!important;filter:drop-shadow(0 16px 24px rgba(0,0,0,.42))!important}#status-progress{appearance:none;-webkit-appearance:none;bottom:9%!important;width:min(68vw,460px)!important;height:10px;border:1px solid rgba(255,255,255,.35);border-radius:999px;overflow:hidden;background:rgba(1,8,19,.7);box-shadow:0 0 0 4px rgba(255,255,255,.05)}#status-progress::-webkit-progress-bar{background:rgba(1,8,19,.7)}#status-progress::-webkit-progress-value{background:linear-gradient(90deg,#35df72,#51b8ff);border-radius:999px}#status-progress::-moz-progress-bar{background:linear-gradient(90deg,#35df72,#51b8ff);border-radius:999px}#status-notice{background:#12243b!important;border-color:#ffcf4a!important;color:#fff!important}</style><script>(()=>{if(window.__floorballRtcTracking)return;window.__floorballRtcTracking=true;const N=window.RTCPeerConnection||window.webkitRTCPeerConnection;if(!N)return;window.__floorballRtcPath='checking';window.__floorballRtcPeers=[];window.RTCPeerConnection=new Proxy(N,{construct(t,a){const p=new t(...a);window.__floorballRtcPeers.push(p);return p;}});setInterval(async()=>{const a=window.__floorballRtcPeers,p=a[a.length-1];if(!p)return;try{const s=await p.getStats();let q;s.forEach(v=>{if(v.type==='transport'&&v.selectedCandidatePairId)q=s.get(v.selectedCandidatePairId);if(!q&&v.type==='candidate-pair'&&v.nominated&&v.state==='succeeded')q=v;});if(!q)return;const l=s.get(q.localCandidateId),r=s.get(q.remoteCandidateId);if(!l||!r)return;window.__floorballRtcPath=(l.candidateType==='relay'||r.candidateType==='relay')?'relay':'direct';}catch(e){}},1000);})();</script>"
