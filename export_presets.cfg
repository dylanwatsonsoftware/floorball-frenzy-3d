variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=true
html/custom_html_shell=""
html/head_include="<script>(()=>{if(window.__floorballRtcTracking)return;window.__floorballRtcTracking=true;const N=window.RTCPeerConnection||window.webkitRTCPeerConnection;if(!N)return;window.__floorballRtcPath='checking';window.__floorballRtcPeers=[];window.RTCPeerConnection=new Proxy(N,{construct(t,a){const p=new t(...a);window.__floorballRtcPeers.push(p);return p;}});setInterval(async()=>{const a=window.__floorballRtcPeers,p=a[a.length-1];if(!p)return;try{const s=await p.getStats();let q;s.forEach(v=>{if(v.type==='transport'&&v.selectedCandidatePairId)q=s.get(v.selectedCandidatePairId);if(!q&&v.type==='candidate-pair'&&v.nominated&&v.state==='succeeded')q=v;});if(!q)return;const l=s.get(q.localCandidateId),r=s.get(q.remoteCandidateId);if(!l||!r)return;window.__floorballRtcPath=(l.candidateType==='relay'||r.candidateType==='relay')?'relay':'direct';}catch(e){}},1000);})();</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
